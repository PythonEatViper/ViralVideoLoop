<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViralVideoLoop</title>
<style>
:root {
  --bg: #f5f4f0; --card: #ffffff; --ink: #1c1b19; --muted: #6f6b63; --line: #e4e1d9;
  --accent: #e8590c; --accent-soft: #fff4ec; --ok: #2b8a3e; --warn: #e67700; --bad: #c92a2a; --off: #adb5bd;
  --pink: #e64980; --violet: #7048e8; --blue: #1c7ed6; --teal: #0ca678; --amber: #f08c00;
  --shadow: 0 1px 2px rgba(30, 20, 10, .05), 0 6px 20px rgba(30, 20, 10, .05);
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151413; --card: #201f1d; --ink: #eceae4; --muted: #9a958b; --line: #34322e;
          --accent: #ff8a4c; --accent-soft: #2e211a; --ok: #51cf66; --warn: #ffa94d; --bad: #ff6b6b; --off: #5c5f66;
          --pink: #f783ac; --violet: #9775fa; --blue: #4dabf7; --teal: #38d9a9; --amber: #fcc419;
          --shadow: 0 1px 2px rgba(0, 0, 0, .3), 0 8px 24px rgba(0, 0, 0, .25); }
}
* { box-sizing: border-box; }
body { margin: 0; color: var(--ink); min-height: 100vh;
       background: radial-gradient(900px 420px at 12% -8%, color-mix(in srgb, var(--accent) 13%, transparent), transparent 70%),
                   radial-gradient(800px 420px at 95% 0%, color-mix(in srgb, var(--violet) 11%, transparent), transparent 70%), var(--bg);
       background-attachment: fixed;
       font: 15px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
a { color: inherit; text-decoration: none; }
header { position: sticky; top: 0; z-index: 5; background: color-mix(in srgb, var(--bg) 82%, transparent);
         backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-bottom: 1px solid var(--line); }
.bar { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -0.01em; display: flex; align-items: center; gap: 9px; }
.brand svg { width: 30px; height: 30px; flex: none; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { padding: 4px 10px; border-radius: 999px; color: var(--muted); font-size: 14px; }
nav a.on, nav a:hover { background: var(--card); color: var(--ink); box-shadow: var(--shadow); }
nav a i { font-style: normal; margin-right: 5px; }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 26px 0 10px; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 18px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 16px 18px; display: block; min-width: 0; box-shadow: var(--shadow); }
a.card { transition: transform .15s, border-color .15s; }
.card.ref { display: grid; grid-template-columns: minmax(0, 1.1fr) minmax(0, 1fr); gap: 18px; margin-bottom: 16px; }
.card.ref img { width: 100%; display: block; border-radius: 10px; cursor: zoom-in; }
.card.ref h2 { color: var(--ink); font-size: 16px; }
.card.ref dl { display: grid; grid-template-columns: 5.5em 1fr; gap: 6px 10px; margin: 10px 0 0; }
.card.ref dt { color: var(--muted); } .card.ref dd { margin: 0; }
@media (max-width: 760px) { .card.ref { grid-template-columns: 1fr; } }
a.card:hover { border-color: var(--accent); transform: translateY(-2px); }
.card h3 { margin: 0 0 10px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.card h3 > span:first-child { display: flex; align-items: center; gap: 8px; color: var(--ink); }
.ico { width: 30px; height: 30px; border-radius: 10px; display: inline-grid; place-items: center; font-size: 16px; flex: none;
       background: color-mix(in srgb, var(--c, var(--accent)) 16%, transparent); }
.hero { border-radius: 20px; padding: 22px 24px; color: #fff; margin-bottom: 16px; box-shadow: var(--shadow);
        background: linear-gradient(120deg, #f76707, #e64980 55%, #7048e8); }
.hero h1 { font-size: 26px; margin: 0; } .hero p { margin: 4px 0 16px; opacity: .9; max-width: 720px; }
.steps { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.steps a { display: flex; align-items: center; gap: 6px; padding: 5px 11px 5px 7px; border-radius: 999px; font-size: 13px;
           background: rgba(255, 255, 255, .16); border: 1px solid rgba(255, 255, 255, .22); white-space: nowrap; }
.steps a.live { background: #fff; color: #c2255c; font-weight: 600; }
.steps a b { font-weight: 700; } .steps .arr { opacity: .6; font-size: 12px; }
.avatar { width: 42px; height: 42px; border-radius: 14px; display: grid; place-items: center; font-size: 22px; flex: none;
          background: linear-gradient(135deg, color-mix(in srgb, var(--c) 28%, transparent), color-mix(in srgb, var(--c) 10%, transparent)); }
.person { display: flex; gap: 12px; align-items: center; margin-bottom: 8px; }
.person b { font-size: 16px; } .runner { font-size: 11.5px; padding: 1px 8px; border-radius: 999px; color: var(--c); border: 1px solid color-mix(in srgb, var(--c) 45%, transparent); }
.conn { text-align: center; color: var(--muted); font-size: 12.5px; margin: -4px 0; }
.big { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.big small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.need { border: 1px solid color-mix(in srgb, var(--accent) 40%, var(--line)); background: var(--accent-soft); }
.need li { margin: 6px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-right: 4px; white-space: nowrap; }
.verdict { display: inline-flex; gap: 5px; align-items: center; font-size: 12.5px; font-weight: 600; padding: 1px 10px; border-radius: 999px; white-space: nowrap;
  color: var(--ink); border: 1px solid color-mix(in srgb, var(--c) 55%, var(--line)); background: color-mix(in srgb, var(--c) 14%, transparent); }
.verdict i { font-style: normal; color: var(--c); }
.sig { display: grid; grid-template-columns: 118px 1fr 132px; gap: 10px; align-items: center; font-size: 13px; margin: 8px 0; }
.sig .track { position: relative; height: 8px; border-radius: 4px; background: color-mix(in srgb, var(--c) 18%, transparent); }
.sig .fill { position: absolute; left: 0; top: 0; bottom: 0; border-radius: 4px; background: var(--c); min-width: 3px; }
.sig .tick { position: absolute; top: -3px; bottom: -3px; width: 2px; margin-left: -1px; background: var(--card); outline: 1px solid var(--muted); opacity: .75; }
.sig .val { text-align: right; white-space: nowrap; }
@media (max-width: 560px) { .sig { grid-template-columns: 96px 1fr 104px; gap: 6px; } }
.tag.hot { border-color: var(--accent); color: var(--accent); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--off); }
.dot.ok { background: var(--ok); } .dot.throttled { background: var(--warn); }
.dot.paused, .dot.silent { background: var(--bad); }
code, .cmd { font-family: var(--mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
.cmd { display: block; padding: 6px 8px; margin-top: 6px; cursor: pointer; }
.cmd:hover { border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--bg); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.meter { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.pipe { display: flex; gap: 6px; flex-wrap: wrap; }
.pipe div { flex: 1; min-width: 78px; text-align: center; padding: 10px 4px; border-radius: 12px; background: var(--bg); color: var(--muted); }
.pipe b { display: block; font-size: 22px; } .pipe i { font-style: normal; display: block; font-size: 18px; }
.pipe div.has { background: color-mix(in srgb, var(--accent) 14%, transparent); color: var(--ink); }
.flow { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); counter-reset: step; }
.flow .card { position: relative; border-top: 3px solid var(--c, var(--line)); }
.flow .card .ico { margin-bottom: 8px; }
.flow .card::before { counter-increment: step; content: counter(step); position: absolute; top: 12px; right: 14px; color: var(--line); font-size: 26px; font-weight: 700; }
.flow .who { font-size: 12.5px; color: var(--c, var(--accent)); padding-right: 30px; }
.org { display: flex; flex-direction: column; gap: 14px; }
.org .row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.md h1, .md h2, .md h3 { color: var(--ink); font-size: 16px; margin: 18px 0 6px; }
.md h1 { font-size: 19px; } .md ul { padding-left: 20px; margin: 6px 0; } .md p { margin: 8px 0; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 8px; } .crumb a { color: var(--accent); }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
select { font: inherit; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
svg text { fill: var(--muted); font-size: 11px; }
.btn { font: inherit; font-size: 13px; font-weight: 600; color: #fff; border: 0; border-radius: 999px; padding: 6px 14px; cursor: pointer; background: linear-gradient(135deg, #f76707, #e64980); }
.btn.ghost { background: none; color: var(--ink); border: 1px solid var(--line); }
.pre { font-family: var(--mono); font-size: 12.5px; line-height: 1.5; white-space: pre-wrap; overflow-wrap: anywhere; margin: 0 0 10px; max-height: 520px; overflow-y: auto;
       background: var(--bg); border: 1px solid var(--line); border-radius: 12px; padding: 12px; }
.field { width: 100%; min-height: 70px; resize: vertical; font: inherit; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 10px 0; }
#chat-btn { position: fixed; right: 22px; bottom: 22px; z-index: 9; width: 58px; height: 58px; border-radius: 50%; border: 0; cursor: pointer; font-size: 26px;
            color: #fff; background: linear-gradient(135deg, #f76707, #e64980 60%, #7048e8); box-shadow: 0 8px 24px rgba(230, 73, 128, .45); transition: transform .15s; }
#chat-btn:hover { transform: scale(1.08); }
#chat { position: fixed; right: 22px; bottom: 92px; z-index: 9; width: min(360px, calc(100vw - 44px)); background: var(--card); border: 1px solid var(--line);
        border-radius: 18px; box-shadow: 0 16px 48px rgba(0, 0, 0, .28); padding: 16px; }
#chat textarea { width: 100%; min-height: 84px; resize: vertical; font: inherit; padding: 10px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); margin: 10px 0; }
#chat button { font: inherit; font-weight: 600; color: #fff; border: 0; border-radius: 999px; padding: 8px 18px; cursor: pointer; background: linear-gradient(135deg, #f76707, #e64980); }
#chat .quick { display: flex; gap: 6px; flex-wrap: wrap; } #chat .quick a { cursor: pointer; }
@media (max-width: 600px) { .kv { grid-template-columns: 1fr; } .big { font-size: 26px; } }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/"><svg viewBox="0 0 32 32"><defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f76707"/><stop offset=".55" stop-color="#e64980"/><stop offset="1" stop-color="#7048e8"/></linearGradient></defs>
    <rect width="32" height="32" rx="9" fill="url(#lg)"/><path d="M22.5 13.2A7 7 0 0 0 9.6 12M9.5 18.8A7 7 0 0 0 22.4 20" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round"/>
    <path d="M9.2 8.6v3.8h3.8M22.8 23.4v-3.8H19" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/><path d="M14.3 13.2v5.6l4.6-2.8z" fill="#fff"/></svg>
    <span>ViralVideoLoop<small id="proj"></small></span></a>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<button id="chat-btn" title="和总监（Claude）聊这个项目" onclick="document.getElementById('chat').hidden^=1">💬</button>
<div id="chat" hidden>
  <div class="person" style="margin:0"><span class="avatar" style="--c:var(--violet)">🧠</span><div><b>产品技术总监</b>
    <div class="small muted">Claude · 这个项目唯一的一场对话，每次都接着上次聊</div></div></div>
  <textarea id="chat-msg" placeholder="想说什么？留空就是「汇报一下现在的情况」"></textarea>
  <div class="quick small"><a class="tag" onclick="chatFill('第一周策略我同意，开始写下一集的分镜')">同意策略</a><a class="tag" onclick="chatFill('昨天那条视频的数据怎么样？下一条该改什么？')">看数据</a><a class="tag" onclick="chatFill('我有个新点子：')">新点子</a></div>
  <div style="display:flex;justify-content:space-between;align-items:center;margin-top:12px"><span id="chat-note" class="small muted">会在「终端」里打开</span><button onclick="chatSend()">发给总监 →</button></div>
</div>
<script>
const D = /*DATA*/null;
// A page built by an older engine may lack newer lists; an empty list keeps the page working.
for (const k of ["forecasts", "engagements", "comments", "incidents", "notes", "signals", "refs", "accounts", "ideas", "learnings", "reviews", "todos", "costs", "metrics", "publishes", "posts", "plans", "ready", "due", "staff"]) D[k] = D[k] || [];
const PAGES = [["", "总览", "🏠"], ["plan", "计划", "📅"], ["posts", "视频", "🎬"], ["signals", "热点", "🔥"], ["ideas", "点子", "💡"],
  ["learnings", "规律", "🧪"], ["cost", "成本", "💰"], ["team", "团队", "👥"], ["flow", "工作流", "🔁"], ["config", "配置", "⚙️"]];
const STAGE_ICON = {idea: "💡", script: "📝", shots: "🎥", review: "👀", ready: "📦", published: "🚀", measured: "📊"};
const RUNNER = {human: ["人类", "var(--teal)"], grok: ["Grok", "var(--accent)"], claude: ["Claude", "var(--violet)"], script: ["脚本", "var(--muted)"]};
const AVATAR = {boss: "👑", pm: "📋", director: "🧠", accountant: "🧮", tiktok: "🎵", reels: "📘", instagram: "📸", youtube: "▶️", reddit: "👽", x: "✖️"};
const ico = (emoji, color) => `<span class="ico" style="--c:${color || "var(--accent)"}">${emoji}</span>`;
const STAGES = [["idea", "点子"], ["script", "分镜"], ["shots", "镜头"], ["review", "待审"], ["ready", "待发"], ["published", "已发"], ["measured", "已出数据"]];
const STATE = {ok: "正常", throttled: "降频", paused: "暂停", silent: "失联", not_started: "未启动", off: "未启用", "n/a": ""};
const GATE = {weekly_strategy: "周策略", storyboard: "分镜", final_cut: "成片", new_character: "新角色", sensitive_topic: "敏感话题", comment_reply: "评论回复", budget: "预算"};
const PLAT = {tiktok: "TikTok", reels: "Facebook Reels", instagram: "Instagram", youtube: "YouTube", reddit: "Reddit", x: "X", news: "新闻", other: "其他"};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(0) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const pct = x => x == null ? "–" : (x * 100).toFixed(0) + "%";
const per1k = (a, views) => a == null || !views ? "–" : (a / views * 1000).toFixed(1);
const when = t => { if (!t) return "–"; const d = new Date(t), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = t => { if (!t) return "从未"; const h = (Date.parse(D.generated_at) - Date.parse(t)) / 36e5;
  return h < 1 ? Math.round(h * 60) + " 分钟前" : h < 48 ? Math.round(h) + " 小时前" : Math.round(h / 24) + " 天前"; };
const link = u => /^https?:\/\//.test(u || "") ? `<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent)">打开 ↗</a>` : "";
const empty = text => `<div class="empty">${text}</div>`;
// Commands are shown short and copied with the absolute path, so they run from any directory.
const full = c => c.replace(/\.\/vvl/g, D.repo + "/vvl");
const cmd = c => `<span class="cmd" title="点击复制（复制的是带完整路径的命令）" data-c="${esc(full(c))}" onclick="navigator.clipboard.writeText(this.dataset.c);this.style.borderColor='var(--ok)'">${esc(c)}</span>`;

function md(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  let html = "", list = false, table = false;
  const close = () => { if (list) html += "</ul>"; if (table) html += "</table></div>"; list = table = false; };
  for (const line of text.split("\n")) {
    const h = line.match(/^(#{1,3})\s+(.*)/), li = line.match(/^\s*[-*]\s+(.*)/);
    if (h) { close(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
    else if (li) { if (!list) { close(); html += "<ul>"; list = true; } html += `<li>${inline(li[1])}</li>`; }
    else if (/^\|/.test(line)) {
      if (/^\|[\s:|-]+\|$/.test(line)) continue;
      const cells = line.split("|").slice(1, -1).map(c => inline(c.trim()));
      if (!table) { close(); html += `<div class="scroll"><table><tr>${cells.map(c => `<th>${c}</th>`).join("")}</tr>`; table = true; }
      else html += `<tr>${cells.map(c => `<td>${c}</td>`).join("")}</tr>`;
    }
    else if (!line.trim()) close();
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close();
  return html;
}

// Latest snapshot per post + platform, and per post overall (highest age).
const LEVEL = {weak: ["▼", "弱", "var(--bad)"], ok: ["●", "一般", "var(--warn)"], strong: ["▲", "强", "var(--ok)"]};
const VERDICT = {push: ["▲", "大概率继续推", "var(--ok)"], hold: ["●", "一般，慢慢涨或停", "var(--warn)"], stall: ["▼", "大概率停推", "var(--bad)"], unknown: ["…", "数据不足", "var(--off)"]};
const rate = v => v >= 0.1 ? (v * 100).toFixed(0) + "%" : v >= 0.01 ? (v * 100).toFixed(1) + "%" : (v * 100).toFixed(2) + "%";
const verdictChip = f => { const [icon, text, c] = VERDICT[f.verdict]; return `<span class="verdict" style="--c:${c}"><i>${icon}</i>${text}${f.score != null ? " · " + f.score : ""}</span>`; };
// Newest forecast per platform for a post; the one with the most data first.
function forecastsFor(postId) {
  const best = {};
  D.forecasts.filter(f => f.post_id === postId).forEach(f => { if (!best[f.platform] || f.age_hours > best[f.platform].age_hours) best[f.platform] = f; });
  return Object.values(best).sort((a, b) => (b.coverage || 0) - (a.coverage || 0));
}
function forecastCard(f, earlier) {
  const meters = (f.signals || []).slice().sort((a, b) => b.weight - a.weight).map(s => { const [icon, word, c] = LEVEL[s.level];
    return `<div class="sig" style="--c:${c}" title="弱：低于 ${rate(s.weak)} · 强：${rate(s.strong)} 以上 · 权重 ${s.weight} · 依据：${{guide: "第三方指南", benchmark: "别人爆款的公开数据"}[s.basis] || "我们的初始估计"}">
      <span>${esc(s.label)}</span><span class="track"><span class="fill" style="width:${s.points}%"></span><span class="tick" style="left:40%"></span><span class="tick" style="left:70%"></span></span>
      <span class="val"><b>${rate(s.value)}</b> <span class="muted">${icon} ${word}</span></span></div>`; }).join("");
  return `<div class="card"><h3><span>${PLAT[f.platform]} · 发布后 ${f.age_hours}h · ${num(f.views)} 播放</span>${verdictChip(f)}</h3>
    ${f.score != null ? `<div class="big">${f.score}<small>/ 100 · 用上了模型 ${pct(f.coverage)} 的信号</small></div>` : `<div class="small muted">播放不到 100，或后台给的指标太少（只覆盖模型的 ${pct(f.coverage)}），不下结论。</div>`}

}
function latestMetric(postId, platform) {

    .sort((a, b) => b.age_hours - a.age_hours)[0];
}

function retentionChart(points) {
  const W = 640, H = 200, P = 28, maxX = Math.max(...points.map(p => p[0])) || 1;
  const x = v => P + v / maxX * (W - P - 8), y = v => H - P - v / 100 * (H - P - 10);
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${P}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v) + 4}">${v}%</text>`).join("");
  const ticks = points.filter((_, i) => i % Math.ceil(points.length / 8) === 0).map(p => `<text x="${x(p[0]) - 6}" y="${H - 8}">${p[0]}s</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${grid}${ticks}
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${points.map(p => `${x(p[0])},${y(p[1])}`).join(" ")}"/></svg>`;
}

async function copyText(button, text) {
  await navigator.clipboard.writeText(text);
  const old = button.textContent; button.textContent = "已复制 ✓"; setTimeout(() => button.textContent = old, 1500);
}
async function instruct(staff) {
  const text = document.getElementById("ins-text").value.trim(), note = document.getElementById("ins-note");
  if (!text) return;
  try {
    if (!location.protocol.startsWith("http")) throw 0;
    const r = await fetch(`/api/instruct?project=${D.project_id}`, {method: "POST", headers: {"X-VVL": "1"}, body: JSON.stringify({staff, text})});
    if (!r.ok) throw 0;
    location.reload();
  } catch (e) {
    await navigator.clipboard.writeText(`${D.repo}/vvl --project ${D.project_id} instruct ${staff} ${JSON.stringify(text)}`).catch(() => {});
    note.textContent = "这个页面是直接打开的文件，不能写入。命令已复制，粘贴到终端运行即可。";
  }
}
// Reload when anything on disk changes, unless the boss is in the middle of typing.
if (location.protocol.startsWith("http")) setInterval(async () => {
  const typing = ["TEXTAREA", "INPUT"].includes(document.activeElement.tagName) || [...document.querySelectorAll("textarea")].some(t => t.value);
  const v = await fetch(`/api/version?project=${D.project_id}`).then(r => r.text()).catch(() => D.version);
  if (v !== D.version && !typing) location.reload();
}, 4000);

function chatFill(text) { const box = document.getElementById("chat-msg"); box.value = text; box.focus(); }
async function chatSend() {
  const message = document.getElementById("chat-msg").value.trim(), note = document.getElementById("chat-note");
  const fallback = `${D.repo}/vvl --project ${D.project_id} chat ${message ? JSON.stringify(message) : ""}`.trim();
  try {
    if (!location.protocol.startsWith("http")) throw 0;
    const r = await fetch(`/api/chat?project=${D.project_id}`, {method: "POST", headers: {"X-VVL": "1"}, body: JSON.stringify({message})});
    if (!r.ok) throw 0;
    note.textContent = "已在「终端」里打开 ✓";
    document.getElementById("chat-msg").value = "";
  } catch (e) {
    // Opened as a plain file (no local server): hand over the command instead.
    await navigator.clipboard.writeText(fallback).catch(() => {});
    note.innerHTML = `这个页面是直接打开的文件，不能启动终端。命令已复制，粘贴到终端运行即可；或用 <code>vvl start</code> 打开看板。`;
  }
}

  document.getElementById("app").innerHTML = view(rest.join("/"));
  const top = {post: "posts", inbox: "", need: "", staff: "team"}[page] ?? page;
  document.getElementById("nav").innerHTML = PAGES.map(([k, label, icon]) => `<a href="#/${k}" class="${k === top ? "on" : ""}"><i>${icon}</i>${label}</a>`).join("");
  document.getElementById("proj").textContent = D.project.name;
  window.scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
