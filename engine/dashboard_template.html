<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ViralVideoLoop</title>
<style>
:root {
  --bg: #f5f4f0; --card: #ffffff; --ink: #1c1b19; --muted: #6f6b63; --line: #e4e1d9;
  --accent: #d9480f; --accent-soft: #fff1e8; --ok: #2b8a3e; --warn: #e67700; --bad: #c92a2a; --off: #adb5bd;
  --mono: ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root { --bg: #151413; --card: #201f1d; --ink: #eceae4; --muted: #9a958b; --line: #34322e;
          --accent: #ff8a4c; --accent-soft: #33221a; --ok: #51cf66; --warn: #ffa94d; --bad: #ff6b6b; --off: #5c5f66; }
}
* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink);
       font: 15px/1.55 -apple-system, "PingFang SC", "Helvetica Neue", sans-serif; }
a { color: inherit; text-decoration: none; }
header { position: sticky; top: 0; z-index: 5; background: var(--bg); border-bottom: 1px solid var(--line); }
.bar { max-width: 1180px; margin: 0 auto; padding: 10px 16px; display: flex; gap: 18px; align-items: center; flex-wrap: wrap; }
.brand { font-weight: 700; letter-spacing: -0.01em; }
.brand small { color: var(--muted); font-weight: 400; margin-left: 6px; }
nav { display: flex; gap: 4px; flex-wrap: wrap; }
nav a { padding: 4px 10px; border-radius: 999px; color: var(--muted); font-size: 14px; }
nav a.on, nav a:hover { background: var(--card); color: var(--ink); }
main { max-width: 1180px; margin: 0 auto; padding: 20px 16px 60px; }
h1 { font-size: 22px; margin: 0 0 4px; letter-spacing: -0.01em; }
h2 { font-size: 15px; margin: 26px 0 10px; color: var(--muted); font-weight: 600; }
.sub { color: var(--muted); margin: 0 0 18px; }
.grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); }
.card { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 14px 16px; display: block; min-width: 0; }
a.card:hover { border-color: var(--accent); }
.card h3 { margin: 0 0 8px; font-size: 13px; color: var(--muted); font-weight: 600; display: flex; justify-content: space-between; }
.big { font-size: 30px; font-weight: 700; line-height: 1.1; letter-spacing: -0.02em; }
.big small { font-size: 13px; font-weight: 400; color: var(--muted); margin-left: 4px; }
.muted { color: var(--muted); } .small { font-size: 13px; }
.need { border-left: 4px solid var(--accent); background: var(--accent-soft); }
.need li { margin: 6px 0; }
ul.plain { list-style: none; margin: 0; padding: 0; }
.tag { display: inline-block; font-size: 12px; padding: 1px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--muted); margin-right: 4px; white-space: nowrap; }
.tag.hot { border-color: var(--accent); color: var(--accent); }
.dot { display: inline-block; width: 9px; height: 9px; border-radius: 50%; margin-right: 6px; background: var(--off); }
.dot.ok { background: var(--ok); } .dot.throttled { background: var(--warn); }
.dot.paused, .dot.silent { background: var(--bad); }
code, .cmd { font-family: var(--mono); font-size: 12.5px; background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 1px 6px; overflow-wrap: anywhere; }
.cmd { display: block; padding: 6px 8px; margin-top: 6px; cursor: pointer; }
.cmd:hover { border-color: var(--accent); }
table { width: 100%; border-collapse: collapse; font-size: 14px; }
th { text-align: left; color: var(--muted); font-weight: 600; font-size: 12.5px; padding: 6px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
td { padding: 8px; border-bottom: 1px solid var(--line); vertical-align: top; }
tr.click { cursor: pointer; } tr.click:hover td { background: var(--bg); }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.scroll { overflow-x: auto; }
.meter { height: 8px; background: var(--line); border-radius: 999px; overflow: hidden; margin: 8px 0 4px; }
.meter i { display: block; height: 100%; background: var(--accent); }
.pipe { display: flex; gap: 6px; flex-wrap: wrap; }
.pipe div { flex: 1; min-width: 74px; text-align: center; padding: 8px 4px; border-radius: 8px; background: var(--bg); }
.pipe b { display: block; font-size: 20px; }
.flow { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(210px, 1fr)); counter-reset: step; }
.flow .card { position: relative; }
.flow .card::before { counter-increment: step; content: counter(step); position: absolute; top: 12px; right: 14px; color: var(--line); font-size: 26px; font-weight: 700; }
.flow .who { font-size: 12.5px; color: var(--accent); padding-right: 30px; }
.org { display: flex; flex-direction: column; gap: 14px; }
.org .row { display: grid; gap: 14px; grid-template-columns: repeat(auto-fit, minmax(230px, 1fr)); }
.org .lvl { font-size: 12.5px; color: var(--muted); margin-bottom: -6px; }
.md h1, .md h2, .md h3 { color: var(--ink); font-size: 16px; margin: 18px 0 6px; }
.md h1 { font-size: 19px; } .md ul { padding-left: 20px; margin: 6px 0; } .md p { margin: 8px 0; }
.kv { display: grid; grid-template-columns: 150px 1fr; gap: 6px 14px; font-size: 14px; }
.kv dt { color: var(--muted); } .kv dd { margin: 0; }
.crumb { font-size: 13px; color: var(--muted); margin-bottom: 8px; } .crumb a { color: var(--accent); }
.empty { color: var(--muted); padding: 18px; text-align: center; border: 1px dashed var(--line); border-radius: 12px; }
select { font: inherit; padding: 3px 8px; border-radius: 8px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
svg text { fill: var(--muted); font-size: 11px; }
@media (max-width: 600px) { .kv { grid-template-columns: 1fr; } .big { font-size: 26px; } }
</style>
</head>
<body>
<header><div class="bar">
  <a class="brand" href="#/">ViralVideoLoop<small id="proj"></small></a>
  <nav id="nav"></nav>
</div></header>
<main id="app"></main>
<script>
const D = /*DATA*/null;
const PAGES = [["", "总览"], ["plan", "计划"], ["posts", "视频"], ["signals", "热点"], ["ideas", "点子"],
  ["learnings", "规律"], ["cost", "成本"], ["team", "团队"], ["flow", "工作流"], ["config", "配置"]];
const STAGES = [["idea", "点子"], ["script", "分镜"], ["shots", "镜头"], ["review", "待审"], ["ready", "待发"], ["published", "已发"], ["measured", "已出数据"]];
const STATE = {ok: "正常", throttled: "降频", paused: "暂停", silent: "失联", not_started: "未启动", off: "未启用", "n/a": ""};
const GATE = {weekly_strategy: "周策略", storyboard: "分镜", final_cut: "成片", new_character: "新角色", sensitive_topic: "敏感话题", comment_reply: "评论回复", budget: "预算"};
const PLAT = {tiktok: "TikTok", reels: "Reels", youtube: "YouTube", x: "X", news: "新闻", other: "其他"};

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"}[c]));
const num = n => n == null ? "–" : n >= 1e6 ? (n / 1e6).toFixed(1) + "M" : n >= 1e4 ? (n / 1e3).toFixed(0) + "K" : n >= 1e3 ? (n / 1e3).toFixed(1) + "K" : String(n);
const pct = x => x == null ? "–" : (x * 100).toFixed(0) + "%";
const per1k = (a, views) => a == null || !views ? "–" : (a / views * 1000).toFixed(1);
const when = t => { if (!t) return "–"; const d = new Date(t), p = n => String(n).padStart(2, "0");
  return `${p(d.getMonth() + 1)}-${p(d.getDate())} ${p(d.getHours())}:${p(d.getMinutes())}`; };
const ago = t => { if (!t) return "从未"; const h = (Date.parse(D.generated_at) - Date.parse(t)) / 36e5;
  return h < 1 ? Math.round(h * 60) + " 分钟前" : h < 48 ? Math.round(h) + " 小时前" : Math.round(h / 24) + " 天前"; };
const link = u => /^https?:\/\//.test(u || "") ? `<a href="${esc(u)}" target="_blank" rel="noopener" style="color:var(--accent)">打开 ↗</a>` : "";
const empty = text => `<div class="empty">${text}</div>`;
const cmd = c => `<span class="cmd" title="点击复制" onclick="navigator.clipboard.writeText(this.textContent);this.style.borderColor='var(--ok)'">${esc(c)}</span>`;

function md(text) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, "<b>$1</b>").replace(/`(.+?)`/g, "<code>$1</code>");
  let html = "", list = false, table = false;
  const close = () => { if (list) html += "</ul>"; if (table) html += "</table></div>"; list = table = false; };
  for (const line of text.split("\n")) {
    const h = line.match(/^(#{1,3})\s+(.*)/), li = line.match(/^\s*[-*]\s+(.*)/);
    if (h) { close(); html += `<h${h[1].length}>${inline(h[2])}</h${h[1].length}>`; }
    else if (li) { if (!list) { close(); html += "<ul>"; list = true; } html += `<li>${inline(li[1])}</li>`; }
    else if (/^\|/.test(line)) {
      if (/^\|[\s:|-]+\|$/.test(line)) continue;
      const cells = line.split("|").slice(1, -1).map(c => inline(c.trim()));
      if (!table) { close(); html += `<div class="scroll"><table><tr>${cells.map(c => `<th>${c}</th>`).join("")}</tr>`; table = true; }
      else html += `<tr>${cells.map(c => `<td>${c}</td>`).join("")}</tr>`;
    }
    else if (!line.trim()) close();
    else { close(); html += `<p>${inline(line)}</p>`; }
  }
  close();
  return html;
}

// Latest snapshot per post + platform, and per post overall (highest age).
function latestMetric(postId, platform) {
  return D.metrics.filter(m => m.post_id === postId && (!platform || m.platform === platform))
    .sort((a, b) => b.age_hours - a.age_hours)[0];
}
const outboxId = p => p.outbox || p.id;
const pendingReviews = () => D.reviews.filter(r => r.status === "pending");
const openTodos = () => D.todos.filter(t => t.status === "open");

function needList(maxTodos) {
  const items = [
    ...pendingReviews().map(r => `<li><span class="tag hot">审核 · ${GATE[r.gate] || esc(r.gate)}</span><b>${esc(r.title)}</b>
      <div class="small muted">${esc(r.summary || "")}${r.path ? ` · 文件：<code>${esc(r.path)}</code>` : ""}</div>
      <div class="small muted">回复秘书，或运行：<code>./vvl review approve ${esc(r.id)}</code></div></li>`),
    ...openTodos().slice(0, maxTodos).map(t => `<li><span class="tag">待办 · ${esc(t.owner || "boss")}</span>${esc(t.text)}
      ${t.why ? `<div class="small muted">${esc(t.why)}</div>` : ""}${t.cmd ? cmd(t.cmd) : ""}
      <div class="small muted">做完后：<code>./vvl todo done ${esc(t.id)}</code></div></li>`),
  ];
  const more = openTodos().length - maxTodos;
  return (items.length ? `<ul class="plain">${items.join("")}</ul>` : `<span class="muted">现在没有需要你处理的事。</span>`)
    + (more > 0 ? `<a href="#/need" class="small" style="color:var(--accent)">还有 ${more} 个待办 →</a>` : "");
}

const views = {
  ""() {
    const plan = D.plans.at(-1), c = D.cost, cap = c.budget.weekly_credit_cap || 0;
    const live = D.posts.filter(p => latestMetric(outboxId(p)));
    const last = live.at(-1), lm = last && latestMetric(outboxId(last));
    const bad = D.staff.filter(s => ["throttled", "paused", "silent"].includes(s.state));
    const bots = D.staff.filter(s => !["human", "script"].includes(s.runner));
    const counts = Object.fromEntries(STAGES.map(([k]) => [k, D.posts.filter(p => p.status === k).length]));
    return `<h1>${esc(D.project.name)} · 总览</h1>
    <p class="sub">生成于 ${when(D.generated_at)} · 每块都能点进去看详情</p>
    <div class="card need"><h3>需要你 <a href="#/need">${pendingReviews().length} 个审核 · ${openTodos().length} 个待办 →</a></h3>${needList(2)}</div>
    <h2>今天</h2>
    <div class="grid">
      <a class="card" href="#/plan"><h3>今日计划 <span>${plan ? esc(plan.name) : ""}</span></h3>
        ${plan ? `<div class="md small">${md(plan.text.split("\n").filter(l => l.trim()).slice(0, 7).join("\n"))}</div>` : `<span class="muted">总监还没写今天的计划（每天 08:30）。</span>`}</a>
      <a class="card" href="#/posts"><h3>最近一条视频 <span>${last ? esc(last.id) : ""}</span></h3>
        ${lm ? `<div class="big">${num(lm.views)}<small>播放 · ${lm.age_hours}h</small></div>
          <div class="small muted">完播 ${pct(lm.completion_rate)} · 每千次播放 ${per1k(lm.shares, lm.views)} 分享 · ${per1k(lm.new_followers, lm.views)} 关注</div>`
          : `<span class="muted">还没有数据。${D.ready.length ? `有 ${D.ready.length} 条等待发布。` : ""}</span>`}
        ${D.due.length ? `<div class="small" style="color:var(--warn)">${D.due.length} 个数据快照到期未抓</div>` : ""}</a>
      <a class="card" href="#/cost"><h3>成本 <span>${esc(c.budget.plan || "")}</span></h3>
        <div class="big">${c.balance ? num(c.balance.credits) : "?"}<small>积分剩余</small></div>
        <div class="meter"><i style="width:${cap ? Math.min(100, c.spent_week / cap * 100) : 0}%"></i></div>
        <div class="small muted">近 7 天用了 ${c.spent_week} / 上限 ${cap}</div></a>
      <a class="card" href="#/team"><h3>团队 <span>${bots.filter(s => s.state === "ok").length}/${bots.filter(s => s.state !== "off").length} 在岗</span></h3>
        ${bots.map(s => `<div class="small"><span class="dot ${s.state}"></span>${esc(s.name)} <span class="muted">${STATE[s.state]}</span></div>`).join("")}
        ${bad.length ? `<div class="small" style="color:var(--bad)">${bad.length} 个需要关注</div>` : ""}</a>
    </div>
    <h2>流水线</h2>
    <a class="card" href="#/posts"><div class="pipe">${STAGES.map(([k, label]) => `<div><b>${counts[k]}</b><span class="small muted">${label}</span></div>`).join("")}</div></a>
    <h2>进来的信息（近 14 天）</h2>
    <div class="grid">
      <a class="card" href="#/signals"><h3>外部热点</h3><div class="big">${D.signals.length}<small>条 · ${D.signals.filter(s => s.stage === "rising").length} 条在起势</small></div></a>
      <a class="card" href="#/ideas"><h3>点子池</h3><div class="big">${D.ideas.filter(i => (i.status || "new") === "new").length}<small>个待选</small></div></a>
      <a class="card" href="#/learnings"><h3>规律库</h3><div class="big">${D.learnings.length}<small>条 · ${D.learnings.filter(l => l.status === "rule").length} 条已成规则</small></div></a>
      <a class="card" href="#/inbox"><h3>老板的话 / 异常</h3><div class="big">${D.notes.length}<small>条留言 · ${D.incidents.length} 次异常${D.rejected_files ? ` · ${D.rejected_files} 个文件被拒` : ""}</small></div></a>
    </div>`;
  },

  need() {
    const done = D.todos.filter(t => t.status === "done"), decided = D.reviews.filter(r => r.status !== "pending");
    return `<h1>需要你</h1><p class="sub">系统只在这些地方停下等你。可以直接回复秘书，也可以自己运行命令。点命令可以复制。</p>
      <div class="card need">${needList(999)}</div>
      ${decided.length ? `<h2>已决定</h2><div class="card"><ul class="plain">${decided.slice().reverse().map(r => `<li><span class="tag">${r.status === "approved" ? "通过" : "要改"}</span>${esc(r.title)} <span class="small muted">${esc(r.decision_note || "")} · ${when(r.at)}</span></li>`).join("")}</ul></div>` : ""}
      ${done.length ? `<h2>已完成的待办</h2><div class="card"><ul class="plain">${done.slice().reverse().map(t => `<li class="muted">✓ ${esc(t.text)}</li>`).join("")}</ul></div>` : ""}`;
  },

  plan(name) {
    if (!D.plans.length) return `<h1>计划</h1>${empty("还没有计划。总监每天 08:30 写一份，放在 <code>plans/</code>。")}`;
    const plan = D.plans.find(p => p.name === name) || D.plans.at(-1);
    return `<h1>计划 · ${esc(plan.name)}</h1>
      <p class="sub">${D.plans.slice().reverse().map(p => `<a class="tag ${p === plan ? "hot" : ""}" href="#/plan/${esc(p.name)}">${esc(p.name)}</a>`).join("")}</p>
      <div class="card md">${md(plan.text)}</div>`;
  },

  posts() {
    if (!D.posts.length) return `<h1>视频</h1>${empty("还没有视频。")}`;
    const rows = D.posts.slice().reverse().map(p => { const m = latestMetric(outboxId(p)) || {};
      return `<tr class="click" onclick="location.hash='#/post/${esc(p.id)}'"><td><b>${esc(p.title)}</b><div class="small muted">${esc(p.hypothesis || "")}</div></td>
        <td><span class="tag ${p.status === "review" ? "hot" : ""}">${(STAGES.find(s => s[0] === p.status) || [0, p.status])[1]}</span></td>
        <td class="num">${num(m.views)}</td><td class="num">${pct(m.hold_3s_rate)}</td><td class="num">${pct(m.completion_rate)}</td>
        <td class="num">${per1k(m.shares, m.views)}</td><td class="num">${per1k(m.comments, m.views)}</td><td class="num">${per1k(m.new_followers, m.views)}</td>
        <td class="small muted">${m.age_hours != null ? m.age_hours + "h" : ""}</td></tr>`; }).join("");
    return `<h1>视频</h1><p class="sub">每条视频是一次实验。分享、评论、关注按每千次播放算，才能跨视频比较。点一行看详情。</p>
      <div class="card scroll"><table><tr><th>视频 / 在测什么</th><th>状态</th><th class="num">播放</th><th class="num">3 秒留存</th><th class="num">完播</th>
        <th class="num">分享/千</th><th class="num">评论/千</th><th class="num">关注/千</th><th>数据时点</th></tr>${rows}</table></div>`;
  },

  post(id) {
    const p = D.posts.find(x => x.id === id);
    if (!p) return empty("找不到这条视频。");
    const oid = outboxId(p), pubs = D.publishes.filter(x => x.post_id === oid);
    const snaps = D.metrics.filter(m => m.post_id === oid).sort((a, b) => a.platform.localeCompare(b.platform) || a.age_hours - b.age_hours);
    const comments = D.comments.filter(c => c.post_id === oid).sort((a, b) => (b.likes || 0) - (a.likes || 0));
    const curve = snaps.filter(m => m.retention && m.retention.length > 1).at(-1);
    const votes = {}; comments.forEach(c => { if (c.vote_for) votes[c.vote_for] = (votes[c.vote_for] || 0) + 1 + (c.likes || 0); });
    const spent = D.costs.filter(c => c.ref === p.id || c.ref === oid).reduce((s, c) => s + c.credits, 0);
    return `<div class="crumb"><a href="#/posts">视频</a> / ${esc(p.id)}</div><h1>${esc(p.title)}</h1>
      <p class="sub"><span class="tag">${esc(p.status)}</span>${p.result ? `<span class="tag hot">假设：${esc(p.result)}</span>` : ""}</p>
      <div class="grid">
        <div class="card"><h3>实验设计</h3><dl class="kv">
          <dt>钩子</dt><dd>${esc(p.hook || "–")}</dd><dt>场景</dt><dd>${esc(p.scene || "–")}</dd>
          <dt>在测什么</dt><dd>${esc(p.hypothesis || "–")}</dd>
          <dt>变量</dt><dd>${Object.entries(p.variables || {}).map(([k, v]) => `<span class="tag">${esc(k)}: ${esc(v)}</span>`).join("") || "–"}</dd>
          <dt>时长</dt><dd>${p.duration_s ? p.duration_s + " 秒" : "–"}</dd><dt>花费</dt><dd>${spent ? spent.toFixed(1) + " 积分" : "–"}</dd></dl></div>
        <div class="card"><h3>发布</h3>${pubs.length ? pubs.map(x => `<div>${PLAT[x.platform]} · ${esc(x.account)} · ${when(x.published_at)} ${link(x.url)}
          <div class="small muted">AI 标识 ${x.ai_label_on ? "开" : "未确认"} · 置顶评论 ${x.pinned_comment_posted ? "已发" : "未确认"}${x.sound_added ? " · 音乐：" + esc(x.sound_added) : ""}</div></div>`).join("")
          : `<span class="muted">还没发布。</span>`}</div>
      </div>
      <h2>数据快照</h2>${snaps.length ? `<div class="card scroll"><table><tr><th>平台</th><th>时点</th><th class="num">播放</th><th class="num">赞</th><th class="num">评论</th><th class="num">分享</th><th class="num">收藏</th>
        <th class="num">新关注</th><th class="num">平均观看</th><th class="num">完播</th><th class="num">推荐页占比</th></tr>
        ${snaps.map(m => `<tr><td>${PLAT[m.platform]}</td><td>${m.age_hours}h</td><td class="num">${num(m.views)}</td><td class="num">${num(m.likes)}</td><td class="num">${num(m.comments)}</td>
          <td class="num">${num(m.shares)}</td><td class="num">${num(m.saves)}</td><td class="num">${num(m.new_followers)}</td><td class="num">${m.avg_watch_s != null ? m.avg_watch_s + "s" : "–"}</td>
          <td class="num">${pct(m.completion_rate)}</td><td class="num">${m.traffic_fyp_pct != null ? m.traffic_fyp_pct + "%" : "–"}</td></tr>`).join("")}</table></div>` : empty("还没有数据。推销员在发布后 1、6、24、72、168 小时各抓一次。")}
      ${curve ? `<h2>留存曲线（${PLAT[curve.platform]} · ${curve.age_hours}h）</h2><div class="card">${retentionChart(curve.retention)}</div>` : ""}
      <h2>值得留的评论</h2>${Object.keys(votes).length ? `<p class="small">投票（含点赞数）：${Object.entries(votes).sort((a, b) => b[1] - a[1]).map(([k, v]) => `<span class="tag hot">${esc(k)} ${v}</span>`).join("")}</p>` : ""}
      ${comments.length ? `<div class="card"><ul class="plain">${comments.map(c => `<li style="margin:8px 0"><span class="tag">${esc(c.tag)}</span>${esc(c.text)} <span class="muted small">♥ ${num(c.likes || 0)}</span>
        ${c.note ? `<div class="small muted">${esc(c.note)}</div>` : ""}</li>`).join("")}</ul></div>` : empty("还没有收集评论。")}`;
  },

  signals(filter) {
    if (!D.signals.length) return `<h1>热点</h1>${empty("侦查员还没有上报。在「团队」页复制提示词，配好 Grok 定时任务后这里会有数据。")}`;
    const [plat, stage] = (filter || "all,all").split(",");
    const rows = D.signals.filter(s => (plat === "all" || s.platform === plat) && (stage === "all" || s.stage === stage))
      .sort((a, b) => (b.relevance || 0) - (a.relevance || 0) || (b.velocity_per_hour || 0) - (a.velocity_per_hour || 0));
    const opt = (list, cur, labels) => list.map(v => `<option value="${v}" ${v === cur ? "selected" : ""}>${labels[v] || v}</option>`).join("");
    return `<h1>热点</h1><p class="sub">近 14 天侦查员上报的外部爆款和趋势，按相关度排序。点一行展开。
      <select onchange="location.hash='#/signals/'+this.value+',${esc(stage)}'">${opt(["all", ...new Set(D.signals.map(s => s.platform))], plat, {all: "全部平台", ...PLAT})}</select>
      <select onchange="location.hash='#/signals/${esc(plat)},'+this.value">${opt(["all", "rising", "peak", "fading"], stage, {all: "全部阶段", rising: "起势", peak: "高峰", fading: "退潮"})}</select></p>
      <div class="card scroll"><table><tr><th>相关</th><th>内容</th><th>平台</th><th>阶段</th><th class="num">播放</th><th class="num">每小时</th><th>看到</th></tr>
      ${rows.map((s, i) => `<tr class="click" onclick="document.getElementById('sg${i}').hidden^=1"><td>${"●".repeat(s.relevance || 0) || "–"}</td>
        <td><b>${esc(s.title)}</b>${s.hook_text ? `<div class="small muted">钩子：${esc(s.hook_text)}</div>` : ""}</td>
        <td>${PLAT[s.platform] || esc(s.platform)}</td><td>${s.stage ? `<span class="tag ${s.stage === "rising" ? "hot" : ""}">${{rising: "起势", peak: "高峰", fading: "退潮"}[s.stage]}</span>` : ""}</td>
        <td class="num">${num(s.views)}</td><td class="num">${num(s.velocity_per_hour && Math.round(s.velocity_per_hour))}</td><td class="small muted">${ago(s.at)} · ${s.seen} 次</td></tr>
        <tr id="sg${i}" hidden><td></td><td colspan="6" class="small"><p>${esc(s.summary)}</p>
          ${s.why_it_works ? `<p><b>为什么有效：</b>${esc(s.why_it_works)}</p>` : ""}${s.use_for_us ? `<p><b>我们可以怎么用：</b>${esc(s.use_for_us)}</p>` : ""}
          ${s.sound ? `<p><b>音乐：</b>${esc(s.sound)}</p>` : ""}<p class="muted">${esc(s.by)} · ${esc(s.format || "")} ${(s.tags || []).map(t => `<span class="tag">${esc(t)}</span>`).join("")} ${link(s.url)}</p></td></tr>`).join("")}
      </table></div>`;
  },

  ideas() {
    if (!D.ideas.length) return `<h1>点子</h1>${empty("点子池是空的。总监每天把热点、评论、老板的话和规律组合成点子，排好序放这里。")}`;
    const rows = D.ideas.slice().sort((a, b) => (b.score || 0) - (a.score || 0));
    return `<h1>点子</h1><p class="sub">总监组合出来的候选视频，按评分排序。</p><div class="card scroll"><table>
      <tr><th class="num">评分</th><th>点子</th><th>在测什么</th><th>状态</th></tr>
      ${rows.map(i => `<tr><td class="num"><b>${i.score ?? "–"}</b></td><td><b>${esc(i.title)}</b><div class="small">钩子：${esc(i.hook)}</div>
        <div class="small muted">${esc(i.scene || "")}${i.reason ? " · " + esc(i.reason) : ""}</div></td>
        <td class="small">${esc(i.hypothesis || "")}</td><td><span class="tag ${i.status === "picked" ? "hot" : ""}">${{new: "待选", picked: "已选", dropped: "放弃"}[i.status || "new"]}</span></td></tr>`).join("")}</table></div>`;
  },

  learnings() {
    if (!D.learnings.length) return `<h1>规律</h1>${empty("还没有规律。")}`;
    const order = ["rule", "supported", "hypothesis", "rejected"], label = {rule: "规则", supported: "有证据", hypothesis: "假设", rejected: "已否定"};
    const rows = D.learnings.slice().sort((a, b) => order.indexOf(a.status) - order.indexOf(b.status));
    return `<h1>规律</h1><p class="sub">这是系统的记忆：假设 → 有证据 → 规则。同类视频攒到 3 条以上才下结论。</p><div class="card scroll"><table>
      <tr><th>状态</th><th>说法</th><th>变量</th><th class="num">支持</th><th class="num">反对</th><th class="num">置信度</th><th>范围</th></tr>
      ${rows.map(l => `<tr><td><span class="tag ${l.status === "rule" ? "hot" : ""}">${label[l.status]}</span></td><td>${esc(l.statement)}</td><td class="small muted">${esc(l.variable || "")}</td>
        <td class="num">${(l.evidence_for || []).length}</td><td class="num">${(l.evidence_against || []).length}</td><td class="num">${pct(l.confidence)}</td>
        <td class="small muted">${{project: "本项目", general: "通用"}[l.scope] || ""}</td></tr>`).join("")}</table></div>`;
  },

  cost() {
    const c = D.cost, b = c.budget, cap = b.weekly_credit_cap || 0;
    const table = (title, obj) => `<div class="card"><h3>${title}</h3><table>${Object.entries(obj).sort((a, b) => b[1] - a[1]).map(([k, v]) =>
      `<tr><td>${esc(k)}</td><td class="num">${v}</td></tr>`).join("") || `<tr><td class="muted">无</td></tr>`}</table></div>`;
    return `<h1>成本</h1><p class="sub">${esc(b.provider || "")} ${esc(b.plan || "")} · 每月 $${b.monthly_usd ?? "?"} / ${b.monthly_credits ?? "?"} 积分${b.commit_until ? ` · 用到 ${esc(b.commit_until)} 再评估` : ""}</p>
      <div class="grid">
        <div class="card"><h3>剩余积分</h3><div class="big">${c.balance ? c.balance.credits : "?"}</div><div class="small muted">${c.balance ? "更新于 " + when(c.balance.at) : ""}</div></div>
        <div class="card"><h3>近 7 天</h3><div class="big">${c.spent_week}<small>/ 上限 ${cap}</small></div><div class="meter"><i style="width:${cap ? Math.min(100, c.spent_week / cap * 100) : 0}%"></i></div>
          <div class="small muted">超过上限，制作会停下并发起「预算」审核</div></div>
        <div class="card"><h3>累计</h3><div class="big">${c.spent_total}<small>积分</small></div>
          <div class="small muted">${b.monthly_credits ? "≈ $" + (c.spent_total * b.monthly_usd / b.monthly_credits).toFixed(2) : ""}</div></div>
      </div>
      <h2>花在哪</h2><div class="grid">${table("按用途 / 视频", c.by_ref)}${table("按模型", c.by_item)}</div>
      <h2>明细</h2><div class="card scroll"><table><tr><th>时间</th><th>项目</th><th>用途</th><th class="num">积分</th></tr>
        ${D.costs.slice().sort((a, b) => Date.parse(b.spent_at || b.at) - Date.parse(a.spent_at || a.at)).slice(0, 80).map(x => `<tr><td class="small muted">${when(x.spent_at || x.at)}</td><td>${esc(x.item)}</td><td>${esc(x.ref || "")}</td><td class="num">${x.credits}</td></tr>`).join("")}</table></div>`;
  },

  team() {
    const card = s => `<div class="card"><h3>${esc(s.id)} <span>${{human: "人类", grok: "Grok", claude: "Claude", script: "脚本"}[s.runner]}</span></h3>
      <div>${STATE[s.state] ? `<span class="dot ${s.state}"></span>` : ""}<b>${esc(s.name)}</b> <span class="muted small">${STATE[s.state]}</span></div>
      <div class="small">${esc(s.duty)}</div>
      ${s.schedule ? `<div class="small muted">作息：${esc(s.schedule)}</div>` : ""}
      ${s.last_seen ? `<div class="small muted">上次活动：${ago(s.last_seen)}${s.last_note ? " · " + esc(s.last_note) : ""}</div>` : ""}
      ${s.runner === "grok" ? cmd(`./vvl prompt ${s.id} | pbcopy`) + `<div class="small muted">↑ 复制提示词，粘贴到这个 bot 的定时任务里</div>` : ""}</div>`;
    const reports = id => D.staff.filter(s => s.reports_to === id);
    const acct = D.accounts.length ? `<h2>账号</h2><div class="card"><table><tr><th>平台</th><th>账号</th><th>类型</th><th class="num">粉丝</th><th>负责</th></tr>
      ${D.accounts.map(a => `<tr><td>${PLAT[a.platform]}</td><td>${esc(a.handle)} ${link(a.url)}</td><td>${esc(a.account_type || "")}</td><td class="num">${num(a.followers)}</td><td>${esc(a.staff || a.by)}</td></tr>`).join("")}</table></div>` : "";
    return `<h1>团队</h1><p class="sub">一家虚拟公司：你是老板，秘书帮你传话和催进度，总监是唯一做决策的，侦查员和推销员在一线。</p>
      <div class="org"><div class="row">${D.staff.filter(s => !s.reports_to).map(card).join("")}</div>
      <div class="lvl">↓ 向老板汇报</div><div class="row">${reports("boss").map(card).join("")}</div>
      <div class="lvl">↓ 向总监汇报</div><div class="row">${reports("director").map(card).join("")}</div></div>${acct}`;
  },

  flow() {
    const n7 = D.signals.filter(s => Date.parse(D.generated_at) - Date.parse(s.at) < 7 * 864e5).length;
    const st = k => D.posts.filter(p => p.status === k).length;
    const gate = g => pendingReviews().filter(r => r.gate === g).length;
    const steps = [
      ["侦查", "侦查员 ×3 · 全天", `外面什么在火：爆款、热点、音乐。<br><b>${n7}</b> 条 / 近 7 天`, "signals"],
      ["入库和校验", "脚本 · 不用模型", `格式不对的文件被拒收，同一条链接只记一次。<br><b>${D.rejected_files}</b> 个文件被拒`, "inbox"],
      ["决策", "总监 · 每天 08:30", `把热点、评论、老板的话和规律组合成点子，写今日计划。<br><b>${D.ideas.length}</b> 个点子`, "plan"],
      ["老板审核：分镜", "你 · 花积分之前", `<b>${gate("storyboard") + gate("weekly_strategy") + gate("new_character")}</b> 个待审`, ""],
      ["制作", "总监", `出镜头、配乐、剪辑。<br><b>${st("script") + st("shots")}</b> 条在做`, "posts"],
      ["老板审核：成片", "你 · 发布之前", `<b>${gate("final_cut")}</b> 个待审`, ""],
      ["发布", "推销员 · 07:00-09:00", `每个平台一个推销员。<br><b>${D.ready.length}</b> 条待发`, "posts"],
      ["回收数据", "推销员 · 发布后 1/6/24/72/168 小时", `数据、留存曲线截图、有价值的评论。<br><b>${D.due.length}</b> 个快照到期`, "posts"],
      ["更新规律", "总监 · 每天 + 周日复盘", `假设成立还是不成立？下一条测什么？<br><b>${D.learnings.length}</b> 条规律 → 回到第 3 步`, "learnings"],
    ];
    return `<h1>工作流</h1><p class="sub">一个闭环：每条视频是一次实验，结果回到规律库，再决定下一条。数字是当前状态，点卡片看对应数据。</p>
      <div class="flow">${steps.map(([t, who, body, href]) => `<a class="card" href="#/${href}"><div class="who">${who}</div><b>${t}</b><div class="small muted">${body}</div></a>`).join("")}</div>
      <h2>数据怎么流</h2><div class="card small"><dl class="kv">
        <dt>外部 agent 写</dt><dd><code>./vvl add &lt;类型&gt; --by &lt;员工 id&gt; --json '{...}'</code>，或把 JSON 文件放进 <code>inbox/&lt;员工 id&gt;/</code></dd>
        <dt>数据库</dt><dd><code>db/*.jsonl</code>，一行一条记录，只追加不修改</dd>
        <dt>总监写</dt><dd><code>plans/</code>（每日计划）、<code>production/</code>（分镜和成片）、<code>outbox/</code>（待发布）</dd>
        <dt>你看</dt><dd>这个看板（<code>./vvl start</code>），或让秘书发截图（<code>./vvl shot</code>）</dd></dl></div>`;
  },

  inbox() {
    const list = (rows, f) => rows.length ? `<div class="card"><ul class="plain">${rows.slice().reverse().map(f).join("")}</ul></div>` : empty("无");
    return `<h1>老板的话 / 异常</h1>
      <h2>老板的话（秘书记录）</h2>${list(D.notes, n => `<li style="margin:8px 0">${esc(n.text)} <span class="small muted">${when(n.at)}${n.topic ? " · " + esc(n.topic) : ""}</span></li>`)}
      <h2>异常</h2>${list(D.incidents, i => `<li style="margin:8px 0"><span class="tag hot">${esc(i.kind)}</span>${esc(i.by)} · ${PLAT[i.platform] || ""}：${esc(i.detail)}
        <span class="small muted">${when(i.at)}${i.action_taken ? " · 处理：" + esc(i.action_taken) : ""}</span></li>`)}
      ${D.rejected_files ? `<p class="small muted">${D.rejected_files} 个文件格式不对，被放进了 <code>inbox/_rejected/</code>，旁边的 .error.txt 写了原因。</p>` : ""}`;
  },

  config() {
    const p = D.project, kv = o => `<dl class="kv">${Object.entries(o).filter(([k]) => k !== "docs").map(([k, v]) => `<dt>${esc(k)}</dt><dd>${Array.isArray(v) ? v.map(x => esc(x)).join("<br>") : esc(v)}</dd>`).join("")}</dl>`;
    return `<h1>配置</h1><p class="sub">来自 <code>project.toml</code>。要改就改那个文件，再运行 <code>./vvl build</code>。</p>
      <h2>项目简报</h2><div class="card">${kv(p.brief)}</div>
      <h2>节奏</h2><div class="card">${kv(p.cadence)}</div>
      <h2>预算</h2><div class="card">${kv(p.budget)}</div>
      <h2>规则</h2><div class="card">${kv(p.rules)}</div>
      <h2>人工审核点（系统在这些地方停下等你）</h2><div class="card">${kv(Object.fromEntries(p.gates.map(g => [GATE[g.id] || g.id, g.when])))}</div>
      <h2>员工作息</h2><div class="card">${kv(Object.fromEntries(D.staff.filter(s => s.schedule).map(s => [s.name, s.schedule])))}</div>`;
  },
};

function retentionChart(points) {
  const W = 640, H = 200, P = 28, maxX = Math.max(...points.map(p => p[0])) || 1;
  const x = v => P + v / maxX * (W - P - 8), y = v => H - P - v / 100 * (H - P - 10);
  const grid = [0, 25, 50, 75, 100].map(v => `<line x1="${P}" x2="${W - 8}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)"/><text x="2" y="${y(v) + 4}">${v}%</text>`).join("");
  const ticks = points.filter((_, i) => i % Math.ceil(points.length / 8) === 0).map(p => `<text x="${x(p[0]) - 6}" y="${H - 8}">${p[0]}s</text>`).join("");
  return `<svg viewBox="0 0 ${W} ${H}" style="width:100%;max-width:${W}px">${grid}${ticks}
    <polyline fill="none" stroke="var(--accent)" stroke-width="2.5" points="${points.map(p => `${x(p[0])},${y(p[1])}`).join(" ")}"/></svg>`;
}

function render() {
  const [page, ...rest] = decodeURIComponent(location.hash.replace(/^#\/?/, "")).split("/");
  const view = views[page] || views[""];
  document.getElementById("app").innerHTML = view(rest.join("/"));
  const top = {post: "posts", inbox: "", need: ""}[page] ?? page;
  document.getElementById("nav").innerHTML = PAGES.map(([k, label]) => `<a href="#/${k}" class="${k === top ? "on" : ""}">${label}</a>`).join("");
  document.getElementById("proj").textContent = D.project.name;
  window.scrollTo(0, 0);
}
addEventListener("hashchange", render);
render();
</script>
</body>
</html>
